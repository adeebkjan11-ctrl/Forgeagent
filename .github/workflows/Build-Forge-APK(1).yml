            ZXMuanNQSwECFAMUAAAACABkYC1dNgOts5EMAAAHLQAAGQAAAAAAAAAAAAAApIGR3QAAZm9yZ2UtYWdlbnQvd2ViL3N0eWxlLmNzc1BLBQYAAAAAHwAfAEkK
            AABZ6gAAAAA=
        run: |
          python - <<'PYTHON'
          import base64, hashlib, io, os, pathlib, zipfile
          raw = base64.b64decode(os.environ['SOURCE_ARCHIVE_B64'])
          if hashlib.sha256(raw).hexdigest() != '7bd0b2e1da4cd107f61742dd2bf344cbc0f47de0d89acb41eec095b710ca9f6e':
              raise SystemExit('Source archive checksum mismatch')
          target = pathlib.Path('bundled-source').resolve()
          target.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for item in z.infolist():
                  destination = (target / item.filename).resolve()
                  if not destination.is_relative_to(target):
                      raise SystemExit('Unsafe archive path')
              z.extractall(target)
          print('Source restored and checksum verified')
          PYTHON
      - name: Install cloud test dependency
        run: python -m pip install 'cryptography>=43,<47'
      - name: Test coding runner
        working-directory: bundled-source/forge-agent
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK and run Android lint
        run: gradle -p bundled-source/forge-agent/android --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-Agent-APK
          path: bundled-source/forge-agent/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: bundled-source/forge-agent/android/app/build/reports/lint-results-debug.html
